<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app-container">
      <h1>Expense &amp; Budget Visualizer</h1>

      <!-- Balance Summary Bar — full width, above columns -->
      <section id="balance-section" aria-labelledby="balance-heading">
        <h2 id="balance-heading">Total Balance</h2>
        <div id="balance-display" aria-live="polite">0.00</div>
      </section>

      <!-- Two-column dashboard layout -->
      <div class="dashboard-columns">

        <!-- Left column: Add Transaction form -->
        <div class="left-col">
          <section id="form-section" aria-labelledby="form-heading">
            <h2 id="form-heading">Add Transaction</h2>
            <form id="transaction-form" novalidate>
              <div class="field-group">
                <label for="item-name">Item Name</label>
                <input
                  type="text"
                  id="item-name"
                  name="item-name"
                  placeholder="e.g. Coffee"
                  maxlength="100"
                  autocomplete="off"
                />
                <span class="field-error" aria-live="polite" id="item-name-error"></span>
              </div>

              <div class="field-group">
                <label for="item-amount">Amount</label>
                <input
                  type="number"
                  id="item-amount"
                  name="item-amount"
                  placeholder="e.g. 4.50"
                  min="0.01"
                  max="999999999.99"
                  step="0.01"
                />
                <span class="field-error" aria-live="polite" id="item-amount-error"></span>
              </div>

              <div class="field-group">
                <label for="item-category">Category</label>
                <select id="item-category" name="item-category">
                  <option value="">-- Select a category --</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Fun">Fun</option>
                </select>
                <span class="field-error" aria-live="polite" id="item-category-error"></span>
              </div>

              <button type="submit" class="btn-submit">Add Transaction</button>
            </form>
          </section>
        </div>

        <!-- Right column: Chart + Transactions list -->
        <div class="right-col">
          <section id="chart-section" aria-labelledby="chart-heading">
            <h2 id="chart-heading">Spending by Category</h2>
            <canvas id="expense-chart" aria-label="Pie chart of spending by category" role="img"></canvas>
          </section>

          <section id="list-section" aria-labelledby="list-heading">
            <h2 id="list-heading">Transactions</h2>
            <ul id="transaction-list" aria-label="Transaction list"></ul>
          </section>
        </div>

      </div>
    </main>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- App logic -->
    <script src="js/app.js" defer></script>
  </body>
</html>
